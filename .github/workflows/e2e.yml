name: CI & E2E Tests

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'

jobs:
  test:
    name: Unit & E2E Integration Tests
    runs-on: ubuntu-latest

    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        ports:
          - 14000:14000
        env:
          PEBBLE_VA_ALWAYS_VALID: 1
          PEBBLE_VA_NOSLEEP: 1
          PEBBLE_WFE_NONCEREJECT: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: cargo test --all-targets --verbose

      - name: Build Vane Binary
        run: cargo build --verbose

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python E2E Tests (Zero Dependencies)
        run: python3 tests/e2e/test_vane.py
