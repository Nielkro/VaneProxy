<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient (Deep Space Navy / Slate) -->
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Core Ambient Radial Glows -->
    <radialGradient id="glowLeft" cx="240" cy="300" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0061ff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="280" cy="300" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#7000ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid pattern for high-tech proxy feel -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <!-- Left Wing Gradient (Cyan / Azure) -->
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0061ff" />
    </linearGradient>

    <!-- Right Wing Gradient (Magenta / Neon Purple) -->
    <linearGradient id="magentaBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#b800ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Center Keel Gradient -->
    <linearGradient id="centerKeel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0061ff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badgePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b800ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Diffuse Glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="1280" height="640" fill="url(#bgGradient)" />

  <!-- 2. Tech Background Grid -->
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- 3. Ambient Aura Spots -->
  <circle cx="260" cy="310" r="280" fill="url(#glowLeft)" />
  <circle cx="300" cy="310" r="260" fill="url(#glowRight)" />

  <!-- Decorative subtle laser guidelines -->
  <line x1="80" y1="520" x2="1200" y2="520" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <line x1="80" y1="120" x2="1200" y2="120" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />

  <!-- ==================== LEFT: LOGO EMBLEM (Scale ~0.9, Centered at x=260, y=310) ==================== -->
  <g transform="translate(260, 310) scale(0.92) translate(-300, -260)">
    <!-- Behind Blade Soft Glows -->
    <path d="M 300,375 L 175,155 L 240,145 L 300,270 Z" fill="#00f2fe" opacity="0.35" filter="url(#softGlow)" />
    <path d="M 300,375 L 425,155 L 360,145 L 300,270 Z" fill="#ff007f" opacity="0.35" filter="url(#softGlow)" />

    <!-- Left Vane Wing (Cyan / Azure) -->
    <path d="M 300,370 L 175,155 L 235,145 L 300,275 Z" fill="url(#cyanBlade)" filter="url(#neonGlow)" />
    <path d="M 300,370 L 235,145 L 255,145 L 300,285 Z" fill="#ffffff" opacity="0.22" />

    <!-- Right Vane Wing (Magenta / Purple) -->
    <path d="M 300,370 L 425,155 L 365,145 L 300,275 Z" fill="url(#magentaBlade)" filter="url(#neonGlow)" />
    <path d="M 300,370 L 365,145 L 345,145 L 300,285 Z" fill="#ffffff" opacity="0.22" />

    <!-- Center Keel / Arrow Head -->
    <polygon points="300,120 314,240 300,370 286,240" fill="url(#centerKeel)" />
    <line x1="300" y1="120" x2="300" y2="370" stroke="#ffffff" stroke-width="1.8" opacity="0.95" />

    <!-- Precision Pivot Point -->
    <circle cx="300" cy="240" r="10" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5" />
    <circle cx="300" cy="240" r="4" fill="#ffffff" filter="url(#neonGlow)" />

    <!-- Lower Tip Focus Glow -->
    <circle cx="300" cy="370" r="3.5" fill="#ffffff" filter="url(#neonGlow)" />
  </g>

  <!-- ==================== RIGHT: TYPOGRAPHY & SPECS (Safe within bounds) ==================== -->
  <g transform="translate(540, 0)">
    <!-- Brand Name: VANE -->
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="94" letter-spacing="14" fill="url(#titleGrad)">
      VANE
    </text>

    <!-- Subtitle / Tagline -->
    <text x="5" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="24" letter-spacing="2" fill="#38bdf8">
      HYBRID L4 SNI ROUTER &amp; L7 REVERSE PROXY
    </text>

    <!-- Description -->
    <text x="5" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="400" font-size="19" fill="#94a3b8">
      High-performance edge proxy in Rust with zero-overhead L4
    </text>
    <text x="5" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="400" font-size="19" fill="#94a3b8">
      splicing, RFC 8737 Auto-SSL, and native Caddyfile syntax.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(5, 415)">
      <!-- Badge 1: Rust Core -->
      <g>
        <rect x="0" y="0" width="140" height="42" rx="10" fill="url(#badgeCyan)" stroke="#0284c7" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#00f2fe" filter="url(#neonGlow)" />
        <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="1" fill="#e0f2fe">
          RUST CORE
        </text>
      </g>

      <!-- Badge 2: ACME v2 -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="135" height="42" rx="10" fill="url(#badgePurple)" stroke="#9333ea" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#c084fc" filter="url(#neonGlow)" />
        <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="1" fill="#fae8ff">
          AUTO-SSL
        </text>
      </g>

      <!-- Badge 3: L4 / L7 Hybrid -->
      <g transform="translate(305, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#badgeGreen)" stroke="#059669" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#34d399" filter="url(#neonGlow)" />
        <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="1" fill="#d1fae5">
          L4 SNI + L7 HTTP
        </text>
      </g>

      <!-- Badge 4: PPv2 -->
      <g transform="translate(485, 0)">
        <rect x="0" y="0" width="125" height="42" rx="10" fill="url(#badgeCyan)" stroke="#0369a1" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#38bdf8" filter="url(#neonGlow)" />
        <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="1" fill="#e0f2fe">
          PPv2 SINK
        </text>
      </g>
    </g>
  </g>
</svg>
