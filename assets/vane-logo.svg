<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Left Blade Gradient (Cyan to Electric Blue) -->
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0061ff" />
    </linearGradient>

    <!-- Right Blade Gradient (Neon Purple to Hot Magenta) -->
    <linearGradient id="magentaBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#b800ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Center Stream / Keel Gradient -->
    <linearGradient id="centerKeel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Flowing Stream Left (L4) -->
    <linearGradient id="streamLeft" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0061ff" stop-opacity="0" />
    </linearGradient>

    <!-- Flowing Stream Right (L7) -->
    <linearGradient id="streamRight" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="600" height="600" rx="120" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Light Backing -->
  <circle cx="300" cy="250" r="200" fill="url(#ambientGlow)" />

  <!-- Incoming Stream 443 (Vertical incoming pulse) -->
  <g opacity="0.85">
    <line x1="300" y1="50" x2="300" y2="140" stroke="url(#centerKeel)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />
    <circle cx="300" cy="140" r="4" fill="#ffffff" filter="url(#neonGlow)" />
  </g>

  <!-- Splitting Divergent Paths (L4 & L7 stream lines) -->
  <path d="M 300,140 Q 230,170 140,220" fill="none" stroke="url(#streamLeft)" stroke-width="2.5" stroke-dasharray="4 8" opacity="0.6" />
  <path d="M 300,140 Q 370,170 460,220" fill="none" stroke="url(#streamRight)" stroke-width="2.5" stroke-dasharray="4 8" opacity="0.6" />

  <!-- The Vane V Structure -->
  <g transform="translate(0, 10)">
    <!-- Behind-the-blade Glows -->
    <path d="M 300,375 L 175,155 L 240,145 L 300,270 Z" fill="#00f2fe" opacity="0.25" filter="url(#softGlow)" />
    <path d="M 300,375 L 425,155 L 360,145 L 300,270 Z" fill="#ff007f" opacity="0.25" filter="url(#softGlow)" />

    <!-- Left Vane Wing (Cyan / Azure) -->
    <path d="M 300,370 L 175,155 L 235,145 L 300,275 Z" fill="url(#cyanBlade)" filter="url(#neonGlow)" />
    <!-- Left Blade Inner Facet (Highlight) -->
    <path d="M 300,370 L 235,145 L 255,145 L 300,285 Z" fill="#ffffff" opacity="0.18" />

    <!-- Right Vane Wing (Magenta / Purple) -->
    <path d="M 300,370 L 425,155 L 365,145 L 300,275 Z" fill="url(#magentaBlade)" filter="url(#neonGlow)" />
    <!-- Right Blade Inner Facet (Highlight) -->
    <path d="M 300,370 L 365,145 L 345,145 L 300,285 Z" fill="#ffffff" opacity="0.18" />

    <!-- Aerodynamic Center Keel / Arrow Head (Splitter Axis) -->
    <polygon points="300,120 314,240 300,370 286,240" fill="url(#centerKeel)" />
    <!-- Center Needle Crest Line -->
    <line x1="300" y1="120" x2="300" y2="370" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

    <!-- Central Hub / Precision Pivot Point -->
    <circle cx="300" cy="240" r="9" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5" />
    <circle cx="300" cy="240" r="3.5" fill="#ffffff" filter="url(#neonGlow)" />

    <!-- Apex Precision Glow Tip -->
    <circle cx="300" cy="370" r="3" fill="#ffffff" filter="url(#neonGlow)" />
  </g>

  <!-- Typography: VANE -->
  <text x="300" y="485" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="54" letter-spacing="16" fill="#ffffff">
    VANE
  </text>
</svg>
