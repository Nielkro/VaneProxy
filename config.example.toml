# Example config for penik-proxy. Copy to /etc/penik-proxy/config.toml
# All comments are illustrative; field names must match src/config.rs.

listen = ["0.0.0.0:443", "[::]:443"]
strict_listen = true

client_hello_timeout_ms = 5000
backend_connect_timeout_ms = 3000
max_client_hello_bytes = 16389

log_level = "error"
access_log = false

default_backend = "caddy"

[[routes]]
sni = "studio.iuharin.ru"
backend = "xray"

[[routes]]
sni = "dmitryme.home.kg"
backend = "xray"

[[routes]]
sni = "penik.ru"
backend = "caddy"

[[routes]]
sni = "slavchat.ru"
backend = "caddy"

[backends.xray]
addr = "127.0.0.1:8443"
send_proxy_protocol = false

[backends.caddy]
addr = "127.0.0.1:8444"
send_proxy_protocol = true

# Unix-socket backend alternative (Caddy: bind unix//run/penik/caddy.sock):
# [backends.caddy]
# addr = "unix:///run/penik/caddy.sock"
# send_proxy_protocol = true
